name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        run: python -m pip install numpy

      - name: Compiler availability (native backend)
        shell: bash
        run: |
          echo "cc: $(command -v gcc || command -v clang || echo 'none (Python backend will be used)')"

      - name: Run test suite
        env:
          AETHER_THREADS: "4"
          AETHER_LLM_MOCK: "1"
        run: python -m unittest discover -s tests -v

      - name: Smoke test the CLI
        shell: bash
        run: |
          python aether.py version
          python aether.py check hello_aether.ae
          python aether.py run examples/control_flow.ae --target python
